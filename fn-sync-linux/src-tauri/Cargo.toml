[package]
name = "fn-sync-client"
version = "0.2.3"
description = "飞牛同步 Linux 客户端"
edition = "2021"
license = "GPL-3.0"

[lib]
name = "fn_sync_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"], default-features = false }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
axum = { version = "0.8", features = ["http1", "tokio", "ws"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-util = "0.3"
prost = "0.14"
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
rand = "0.9"
rand_core = "0.9"
chrono = { version = "0.4", features = ["serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rsa = "0.9"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
mdns-sd = "0.14"
notify = "8"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
dashmap = "6"
lru = "0.12"
libc = "0.2"
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
# 按需同步：FUSE3 用户态挂载（纯 Rust 实现，无需 libfuse；运行时依赖系统 fusermount3）
fuser = { version = "0.15", features = ["abi-7-11", "abi-7-12"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package.metadata.deb]
maintainer = "fn-sync linux port"
copyright = "Use of this software is for interoperability research"
depends = "$auto, libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1, fuse3"
section = "utils"
priority = "optional"
extended-description = """\
飞牛同步 (FN Sync) Linux 客户端 — 与 fnOS NAS 同步服务互通的文件同步工具。
逆向实现自官方 0.2.3 Windows/macOS 客户端。
支持按需同步（open_cloud）：FUSE3 挂载，文件仅占位元数据，打开时才下载，缓存 LRU 淘汰释放磁盘。
"""
assets = [
    ["target/release/fn-sync-client", "usr/bin/fn-sync-client", "755"],
    ["debian/fn-sync-client.desktop", "usr/share/applications/", "644"],
    ["icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/fn-sync-client.png", "644"],
    ["icons/512x512.png", "usr/share/icons/hicolor/512x512/apps/fn-sync-client.png", "644"],
]

