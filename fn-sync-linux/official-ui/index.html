  <body>
    <div class="overflow-hidden" id="root"></div>
    <script>
      const mql = window.matchMedia('(prefers-color-scheme: dark)');

      function matchMode(e) {
        const body = document.body;
        if (e.matches) {
          if (!body.hasAttribute('theme-mode')) {
            body.setAttribute('theme-mode', 'dark');
          }
        } else {
          if (body.hasAttribute('theme-mode')) {
            body.removeAttribute('theme-mode');
          }
        }
      }

      // 在页面加载时立即检查当前的系统颜色模式
      matchMode(mql);

      mql.addListener(matchMode);
    </script>
    <script>
      async function detectWindows10() {
        let isWindows10 = false;

        if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
          try {
            const ua = await navigator.userAgentData.getHighEntropyValues(['platformVersion']);

            if (navigator.userAgentData.platform === 'Windows') {
              const platformVersion = ua.platformVersion;
              const majorVersion = parseInt(platformVersion.split('.')[0]);
              if (majorVersion >= 1 && majorVersion <= 12) {
                isWindows10 = true;
              }
            }
          } catch (error) {
            isWindows10 = checkUserAgentFallback();
          }
        }

        if (isWindows10) {
          const rootDiv = document.getElementById('root');
          if (rootDiv) {
            rootDiv.classList.add('border-t-[0.5px]', 'border-black', 'border-solid');
            console.log('已应用Windows 10样式');
          }
        }
      }

      detectWindows10();
    </script>
